<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Owner Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    h1 {
      color: #ffffff;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .printer-config {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .printer-config label {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .printer-config input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #ffffff;
      width: 150px;
      font-size: 14px;
    }
    
    .refresh-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
    }
    
    .stat-label {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }
    
    .stat-pending { border-top: 4px solid #f59e0b; }
    .stat-approved { border-top: 4px solid #3b82f6; }
    .stat-printed { border-top: 4px solid #10b981; }
    .stat-total { border-top: 4px solid #8b5cf6; }
    
    .jobs-grid {
      display: grid;
      gap: 16px;
    }
    
    .job-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .job-info h3 {
      font-size: 18px;
      color: #1e293b;
      margin-bottom: 4px;
    }
    
    .job-id {
      font-size: 12px;
      color: #64748b;
      font-family: monospace;
    }
    
    .job-time {
      font-size: 13px;
      color: #64748b;
    }
    
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }
    
    .status-approved {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .status-printed {
      background: #d1fae5;
      color: #065f46;
    }
    
    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }
    
    .files-list {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .files-list h4 {
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: white;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    
    .file-item:last-child {
      margin-bottom: 0;
    }
    
    .file-icon {
      font-size: 20px;
    }
    
    .file-name {
      flex: 1;
      color: #1e293b;
      font-weight: 500;
    }
    
    .file-size {
      color: #64748b;
      font-size: 12px;
    }
    
    .job-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
    }
    
    .btn-approve {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
    }
    
    .btn-approve:hover {
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .btn-print {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    
    .btn-print:hover {
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    
    .btn-reject {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    
    .btn-reject:hover {
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    
    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      background: #1e293b;
      color: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
    }
    
    .toast.show {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🖨️ Shop Owner Dashboard</h1>
      <div class="printer-config">
        <label>Printer IP:</label>
        <input type="text" id="printerIp" placeholder="192.168.x.x" value="">
        <button class="refresh-btn" onclick="loadJobs()">🔄 Refresh</button>
      </div>
    </div>
    
    <div class="stats" id="stats">
      <div class="stat-card stat-pending">
        <div class="stat-value" id="pendingCount">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card stat-approved">
        <div class="stat-value" id="approvedCount">0</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat-card stat-printed">
        <div class="stat-value" id="printedCount">0</div>
        <div class="stat-label">Printed</div>
      </div>
      <div class="stat-card stat-total">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Total Jobs</div>
      </div>
    </div>
    
    <div class="jobs-grid" id="jobsList">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Loading jobs...</p>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMessage">Action completed</span>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let jobs = [];
    
    // Load jobs on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadJobs();
      // Auto-refresh every 10 seconds
      setInterval(loadJobs, 10000);
    });
    
    async function loadJobs() {
      try {
        const res = await fetch(`${API_BASE}/uploads`);
        const data = await res.json();
        jobs = data.uploads || [];
        
        // Sort by timestamp (newest first)
        jobs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        updateStats();
        renderJobs();
      } catch (error) {
        console.error('Error loading jobs:', error);
        showToast('❌', 'Failed to load jobs');
      }
    }
    
    function updateStats() {
      const pending = jobs.filter(j => j.status === 'pending').length;
      const approved = jobs.filter(j => j.status === 'approved').length;
      const printed = jobs.filter(j => j.status === 'printed').length;
      
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('approvedCount').textContent = approved;
      document.getElementById('printedCount').textContent = printed;
      document.getElementById('totalCount').textContent = jobs.length;
    }
    
    function renderJobs() {
      const container = document.getElementById('jobsList');
      
      if (jobs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>No print jobs yet</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = jobs.map(job => `
        <div class="job-card">
          <div class="job-header">
            <div class="job-info">
              <h3>👤 ${job.username || 'Unknown'}</h3>
              <div class="job-id">${job.jobId}</div>
              <div class="job-time">📅 ${formatDate(job.timestamp)}</div>
            </div>
            <span class="status-badge status-${job.status}">${job.status}</span>
          </div>
          
          <div class="files-list">
            <h4>📄 Files (${job.files?.length || 0})</h4>
            ${(job.files || []).map(file => `
              <div class="file-item">
                <span class="file-icon">${getFileIcon(file.originalName)}</span>
                <span class="file-name">${file.originalName}</span>
                <span class="file-size">${formatSize(file.size)}</span>
              </div>
            `).join('')}
          </div>
          
          <div class="job-actions">
            ${job.status === 'pending' ? `
              <button class="btn btn-approve" onclick="approveJob('${job.jobId}')">
                ✅ Approve
              </button>
              <button class="btn btn-reject" onclick="rejectJob('${job.jobId}')">
                ❌ Reject
              </button>
            ` : ''}
            ${job.status === 'approved' ? `
              <button class="btn btn-print" onclick="printJob('${job.jobId}')">
                🖨️ Print
              </button>
              <button class="btn btn-reject" onclick="rejectJob('${job.jobId}')">
                ❌ Reject
              </button>
            ` : ''}
            ${job.status === 'printed' ? `
              <button class="btn btn-print" onclick="printJob('${job.jobId}')" style="opacity: 0.7;">
                🖨️ Reprint
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }
    
    async function approveJob(jobId) {
      try {
        const res = await fetch(`${API_BASE}/approve-job`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId })
        });
        
        if (res.ok) {
          showToast('✅', 'Job approved successfully');
          loadJobs();
        } else {
          const error = await res.json();
          showToast('❌', error.error || 'Failed to approve');
        }
      } catch (error) {
        showToast('❌', 'Error approving job');
      }
    }
    
    async function rejectJob(jobId) {
      if (!confirm('Are you sure you want to reject this job?')) return;
      
      try {
        const res = await fetch(`${API_BASE}/update-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId, status: 'rejected' })
        });
        
        if (res.ok) {
          showToast('✅', 'Job rejected');
          loadJobs();
        } else {
          showToast('❌', 'Failed to reject job');
        }
      } catch (error) {
        showToast('❌', 'Error rejecting job');
      }
    }
    
    async function printJob(jobId) {
      const printerIp = document.getElementById('printerIp').value.trim();
      
      if (!printerIp) {
        showToast('⚠️', 'Please enter printer IP address');
        document.getElementById('printerIp').focus();
        return;
      }
      
      // First, make sure job is approved (for reprint)
      const job = jobs.find(j => j.jobId === jobId);
      if (job && job.status === 'printed') {
        await fetch(`${API_BASE}/update-status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId, status: 'approved' })
        });
      }
      
      showToast('🖨️', 'Sending to printer...');
      
      try {
        const res = await fetch(`${API_BASE}/print-job`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId, printerIp })
        });
        
        const result = await res.json();
        
        if (result.success) {
          showToast('✅', `Printed ${result.printedCount} file(s) to ${printerIp}`);
        } else {
          showToast('⚠️', `Printed ${result.printedCount}/${result.totalFiles} files`);
        }
        
        loadJobs();
      } catch (error) {
        showToast('❌', 'Error: ' + error.message);
      }
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString();
    }
    
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
    
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        pdf: '📄',
        jpg: '🖼️',
        jpeg: '🖼️',
        png: '🖼️',
        gif: '🖼️',
        doc: '📝',
        docx: '📝',
        txt: '📝'
      };
      return icons[ext] || '📎';
    }
    
    function showToast(icon, message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
